name: iOS build

on:
  pull_request:
    paths: ['ios/**', '.github/workflows/ios.yml']
  push:
    branches: [main]
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  xcode:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path ios/Packages/MyTimeCore
      - name: Build iPhone app
        run: |
          xcodebuild -project ios/MyTime.xcodeproj -scheme MyTime \
            -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build
