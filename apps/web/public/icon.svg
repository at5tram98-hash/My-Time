<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- My Time（v3.1）：iOS 純正アプリ調。白い面に、進捗リング（赤〜オレンジ）と時計の針だけ -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#ECECF1"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF9F0A"/>
      <stop offset="0.55" stop-color="#FF453A"/>
      <stop offset="1" stop-color="#FF2D55"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- リングの溝 -->
  <circle cx="512" cy="512" r="318" fill="none" stroke="#E3E3E8" stroke-width="92"/>
  <!-- 進捗（約3/4）。12時から時計回り -->
  <circle cx="512" cy="512" r="318" fill="none" stroke="url(#arc)" stroke-width="92" stroke-linecap="round"
          stroke-dasharray="1498 1998" transform="rotate(-90 512 512)" filter="url(#soft)"/>
  <!-- 針（10時10分ではなく、すっきり見える 12時と4時） -->
  <g stroke="#1C1C1E" stroke-linecap="round" filter="url(#soft)">
    <line x1="512" y1="512" x2="512" y2="300" stroke-width="40"/>
    <line x1="512" y1="512" x2="640" y2="590" stroke-width="40"/>
  </g>
  <circle cx="512" cy="512" r="34" fill="#1C1C1E"/>
  <circle cx="512" cy="512" r="14" fill="#FF453A"/>
</svg>
