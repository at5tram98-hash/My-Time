<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- My Time（v2）：時間の輪（進捗）と時計の針。背景の上にガラスの円盤を重ねたリキッドグラス調 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4FA8FF"/>
      <stop offset="0.55" stop-color="#1E6BFF"/>
      <stop offset="1" stop-color="#4B3FE0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.2" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C8FFB4"/>
      <stop offset="1" stop-color="#4EDB5E"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#0B1D6B" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>
  <g filter="url(#sh)">
    <circle cx="512" cy="512" r="330" fill="url(#glass)"/>
    <circle cx="512" cy="512" r="328" fill="none" stroke="url(#rim)" stroke-width="5"/>
  </g>
  <circle cx="512" cy="512" r="262" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="58"/>
  <path d="M512 250 A262 262 0 1 1 285 643" fill="none" stroke="url(#g)" stroke-width="58" stroke-linecap="round"/>
  <path d="M512 372 V512 L604 572" fill="none" stroke="#ffffff" stroke-width="48" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="512" cy="512" r="26" fill="#ffffff"/>
</svg>
